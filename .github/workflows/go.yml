name: Go

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.16'
      - run: go mod tidy
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
